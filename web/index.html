<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memberberry</title>
    <link rel="stylesheet" href="/src/shell/app.css" />
  </head>
  <body>
    <!--
      `mb-server` replaces this element with the same one carrying escaped `data-vault`,
      `data-note` and `data-user`. Served straight from Vite the attributes stay empty and the
      editor runs against a purely local replica, which is the `npm run dev` inner loop.

      The attribute values are empty rather than absent so the server has one exact string to
      match, and a test can assert the marker still exists.
    -->
    <div id="app" data-vault="" data-note="" data-user=""></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
