[workspace]
resolver = "3"
members = [
    "crates/mb-auth",
    "crates/mb-core",
    "crates/mb-crdt",
    "crates/mb-wasm",
    "crates/mb-server",
    "crates/mb-cli",
]
# `fuzz/` needs a nightly toolchain for libFuzzer, so it builds on its own (see `make fuzz`).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
crc32fast = "1"
mb-core = { path = "crates/mb-core" }
mb-auth = { path = "crates/mb-auth" }
mb-crdt = { path = "crates/mb-crdt" }
mb-server = { path = "crates/mb-server" }
mb-wasm = { path = "crates/mb-wasm" }
thiserror = "2"
yrs = "0.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# AGENTS.md 4.2: no panicking constructs in library code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
