# Deliberately outside the workspace: libFuzzer needs a nightly toolchain and its own
# profile, and neither should leak into `cargo test --workspace` on stable.
[package]
name = "mb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mb-core = { path = "../crates/mb-core" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
