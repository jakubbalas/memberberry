name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Full-test orchestration regression
        run: python3 scripts/full-test-test.py

      - name: WASM cache isolation regression
        run: python3 scripts/wasm-ci-test.py

      - name: Manual E2E workflow regression
        run: python3 scripts/e2e-workflow-test.py

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage reuse regression
        run: python3 scripts/coverage-run-test.py

      # The per-crate floors in AGENTS.md §2.1, enforced separately per crate so a crate
      # below its floor cannot hide behind one above it.
      - name: Coverage gate
        run: make coverage-gate

      # Both pure browser crates compile to wasm32 on every commit so the web build can never
      # silently break on an accidental std::fs or SystemTime (AGENTS.md §4.2).
      - name: wasm32 build
        run: cargo check -p mb-core -p mb-search --target wasm32-unknown-unknown

      # SPEC.md §20.2 promises theme authors that the token names are a stable public API.
      # This is what makes that a promise rather than a hope: it fails on an undeclared
      # token, on a token nothing uses, and on a literal colour anywhere else (AGENTS.md
      # §4.4). It lives in this job because it reads both the Rust and the web trees.
      - name: Design-token contract
        run: python3 scripts/token-check.py

  # The frontend, and with it the WebAssembly bridge. The boundary tests in
  # `web/src/notes.test.ts` run against a real wasm build, so this job is what proves the
  # Rust↔TypeScript contract on every commit rather than only when someone runs it locally.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build the WebAssembly bindings
        run: make wasm-ci

      - run: npm ci
        working-directory: web
      - name: Types
        run: npm run typecheck
        working-directory: web
      - name: Tests and coverage
        run: npm run coverage
        working-directory: web
      # `npm run coverage` reports but does not enforce. The floors in AGENTS.md 2.1 are
      # checked here, the same way the Rust ones are — a floor nobody enforces is a comment.
      - name: Frontend coverage floor
        run: python3 scripts/web-coverage-gate.py
      - name: Production build
        run: npm run build
        working-directory: web


  # The SPEC 21 budgets (SPEC 21, 23 M7).
  #
  # Two halves, gated differently on purpose. The bundle budget is deterministic — the same
  # build gzips to the same byte count on any machine — so it is enforced, and any growth
  # past the value recorded in web/perf/breaches.json fails this job. The browser half runs
  # in --report-only mode: 21.1 wants the desktop class pinned to "CI runner spec, fixed and
  # recorded", nobody has recorded it, and an absolute millisecond budget on a shared runner
  # would be a flaky gate — which AGENTS.md 2.3 counts as a failing one. Running it anyway is
  # what keeps the harness itself from rotting, and the report is uploaded either way.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build the WebAssembly bindings
        run: make wasm-ci
      - run: npm ci
        working-directory: web
      - name: Build the frontend
        run: npm run build
        working-directory: web

      # Enforced. Deterministic, and needs no browser and no server.
      - name: Critical-path bundle budget
        run: npm run perf -- --bundle-only
        working-directory: web

      - name: Build the server
        run: cargo build -p mb-cli
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      # Reported, not enforced. See the comment above this job.
      - name: Runtime budgets, desktop and mobile
        run: npm run perf -- --report-only
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: target/perf/report.json
          retention-days: 30

  # The fuzz targets are built, not run: a useful run takes minutes and one known upstream
  # panic is still open (SPEC.md §22.1). Building them stops the targets rotting against
  # changes to mb-core, which is what silently happens to fuzzers nobody compiles.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
        working-directory: fuzz
