[package]
name = "mb-server"
description = "HTTP and WebSocket server: vault registry, read-only rendering. Axum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mb-core.workspace = true
mb-auth.workspace = true
mb-crdt.workspace = true
mb-index.workspace = true
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
# why: gzip for the response compression layer. SPEC §21.1 states the problem it solves
# and §21.7 what it cost; `compress.rs` says why this rather than `tower-http`. Default
# features build the pure-Rust miniz_oxide backend, so no C toolchain is added.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The `Body` trait, for the exact size hint that decides whether a response is worth
# compressing without consuming a body that could not then be rebuilt.
http-body = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
# why: macOS stores filenames decomposed (NFD) and note text carries them composed (NFC),
# so a byte comparison makes every accented note name unreachable through its own wikilink.
unicode-normalization = "0.1"
notify = "8"
object_store = { version = "0.12", features = ["aws"] }
sha2 = "0.10"
yrs.workspace = true

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true

[[bench]]
name = "sync"
harness = false
