[package]
name = "mb-index"
description = "SQLite graph, link, tag, task and media store for a vault, behind a permission-filtered reader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mb-core.workspace = true
# why: `bundled` compiles SQLite from source rather than linking whatever the host has.
# The index is derived state (Invariant I1) and its schema is stamped in `user_version`, so
# a version skew between two machines that share a vault directory would silently change
# which SQL features parse. Bundling makes that skew impossible.
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
# why: the graph query has invariants a table of examples cannot cover — every edge's
# endpoints are nodes, a node's hop is its true distance, and an n-hop graph contains an
# (n-1)-hop one. Those are statements about *every* link structure, which is what a
# generator is for (`AGENTS.md` §2.2).
proptest = "1"

[lints]
workspace = true
