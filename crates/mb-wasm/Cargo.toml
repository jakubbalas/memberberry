[package]
name = "mb-wasm"
description = "wasm-bindgen surface over mb-core. The browser's only route to the block model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mb-core.workspace = true
mb-crdt.workspace = true
mb-search.workspace = true
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
