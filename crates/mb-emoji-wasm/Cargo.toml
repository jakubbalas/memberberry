[package]
name = "mb-emoji-wasm"
description = "Lazy WASM surface for Memberberry's offline Unicode emoji catalog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mb-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[lints]
workspace = true
